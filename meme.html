<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1080px; height: 1080px; overflow: hidden; font-family: Impact, "Arial Black", sans-serif; }
  .scene { position: relative; width: 1080px; height: 1080px; overflow: hidden;
    background: linear-gradient(180deg, #2b0a4a 0%, #8a1f7a 34%, #ff4f7b 55%, #ffb347 70%, #ffd36b 74%); }
  .sun { position: absolute; left: 340px; top: 360px; width: 400px; height: 400px; border-radius: 50%;
    background: linear-gradient(180deg, #ffe66b 0%, #ff8a3d 60%, #ff3d77 100%); }
  .sun-stripes { position: absolute; left: 330px; top: 600px; width: 420px; height: 170px;
    background: repeating-linear-gradient(180deg, transparent 0 18px, #ff6a6a 18px 26px); opacity: .55; }
  .sea { position: absolute; left: 0; top: 760px; width: 1080px; height: 320px;
    background: linear-gradient(180deg, #19c3c9 0%, #0b7d9a 45%, #f2d49b 46%, #e9c07e 100%); }
  .palm { position: absolute; bottom: 300px; }
  .top, .bottom { position: absolute; left: 0; width: 1080px; text-align: center; color: #fff;
    -webkit-text-stroke: 4px #000; paint-order: stroke fill; letter-spacing: 1px; }
  .top { top: 28px; font-size: 84px; line-height: 0.98; }
  .bottom { bottom: 26px; font-size: 78px; line-height: 0.98; }
  .mission { position: absolute; top: 240px; width: 1080px; text-align: center;
    font-size: 120px; font-style: italic; color: #f5c518; -webkit-text-stroke: 6px #000; paint-order: stroke fill;
    transform: rotate(-3deg); text-shadow: 6px 6px 0 #000; }
  .respect { position: absolute; top: 380px; width: 1080px; text-align: center; font-size: 56px; color: #fff;
    -webkit-text-stroke: 3px #000; paint-order: stroke fill; transform: rotate(-3deg); }
  .ghost { position: absolute; left: 90px; top: 470px; width: 470px; height: 470px; filter: drop-shadow(0 18px 10px rgba(0,0,0,.35)); }
  .laptop { position: absolute; left: 560px; top: 610px; width: 430px; }
  .screen { width: 430px; height: 260px; background: #191419; border: 10px solid #2f2f36; border-radius: 16px 16px 0 0;
    box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .brand { font-family: "Arial Black", Arial, sans-serif; font-weight: 900; color: #fff; font-size: 66px; letter-spacing: -1px; }
  .brand .dot { color: #ff3fb0; }
  .win { margin-top: 6px; font-size: 60px; color: #36e07a; }
  .base { width: 490px; height: 30px; margin-left: -30px; background: #c9c9d1; border-radius: 0 0 22px 22px; border-top: 4px solid #8d8d96; }
</style>
</head>

</html>
